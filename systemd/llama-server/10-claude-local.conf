# claude-local: fit llama-server to a single small-model coding client.
# Mirrors ollama.service.d/10-claude-local.conf: 128K context, q8_0 KV (needs
# flash attention), one slot, KV-shift cache reuse, a 16GB prompt cache kept in RAM
# per model instance (one slot means a parent and its side calls -- subagents, WebFetch
# summaries, the odd classifier -- evict each other from the KV cache; the RAM cache is
# what brings the parent back without a re-prefill. Measured 2026-09-08 on the Qwen3.6
# presets: ~70 MB per 1K tokens, so a full 112K-token parent is ~8 GB and 16 GB holds it
# plus several side contexts. The cache is PER INSTANCE: with LLAMA_ARG_MODELS_MAX=2 that
# is 32 GB of RAM on top of ~52 GB of GTT for two sets of weights and KV, of the host's
# 125 GB. At 32 GB per instance the unit peaked at 47 GB RAM + 4.7 GB swap with two presets
# resident; claude-local-doctor checks this budget),
# Ollama-parity batch sizes, up to two resident models in router mode (two 27B-class
# models take 56GB of the 108GB pool; a third load evicts the least recently used after
# the proxy has checkpointed it). --slot-save-path and --no-webui have no LLAMA_ARG_* form
# and are passed by the wrapper.
[Service]
Environment=LLAMA_ARG_CTX_SIZE=131072
Environment=LLAMA_ARG_N_PARALLEL=1
Environment=LLAMA_ARG_FLASH_ATTN=on
Environment=LLAMA_ARG_CACHE_TYPE_K=q8_0
Environment=LLAMA_ARG_CACHE_TYPE_V=q8_0
Environment=LLAMA_ARG_CACHE_REUSE=256
Environment=LLAMA_ARG_CACHE_RAM=16384
Environment=LLAMA_ARG_BATCH=2048
Environment=LLAMA_ARG_UBATCH=2048
Environment=LLAMA_ARG_ENDPOINT_METRICS=1
Environment=LLAMA_ARG_ENDPOINT_SLOTS=1
Environment=LLAMA_ARG_OFFLINE=1
Environment=LLAMA_ARG_MODELS_MAX=2
