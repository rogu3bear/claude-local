# claude-local: fit llama-server to a small-model coding client with LANES.
# q8_0 KV (needs flash attention), KV-shift cache reuse, and a 16GB prompt cache
# kept in RAM per model instance.
#
# LANES (LLAMA_ARG_N_PARALLEL): each lane is an independent KV slot. With one lane,
# a parent and its side calls -- subagents, WebFetch summaries, the odd classifier --
# evict each other from the single slot, so the parent re-prefills its whole context
# (30s+) every time a subagent runs (measured: 61 slot evictions in one session,
# 2026-09-09). Two lanes give the parent and one side call a slot each: no eviction.
# CTX_SIZE is the TOTAL across lanes; per-lane context = CTX_SIZE / N_PARALLEL, so
# keep CTX_SIZE = lanes * 131072 to hold a full 131K conversation per lane. The
# launcher sizes autocompact from the per-lane context (CLAUDE_LOCAL_AUTOCOMPACT).
#
# Memory (measured ~70 MB per 1K tokens KV): one instance at 2 lanes / 262144 total
# = ~21GB weights + ~18GB KV + up to 16GB RAM cache = ~55GB of the host's 125GB.
# 4 lanes = ~74GB. The RAM cache is PER INSTANCE, so MODELS_MAX>1 multiplies it:
# MODELS_MAX=1 keeps one model resident (a /model switch reloads in ~10-20s) and
# leaves headroom for more lanes. Raise MODELS_MAX only if you accept ~2x the budget
# and stay within claude-local-doctor's check. CLAUDE_LOCAL_LANES=<n> in
# ~/.claude-local/env (or the environment) rewrites N_PARALLEL/CTX_SIZE here and
# restarts the unit on the next launch when no other session is live.
# --slot-save-path and --no-webui have no LLAMA_ARG_* form and are passed by the wrapper.
[Service]
Environment=LLAMA_ARG_CTX_SIZE=262144
Environment=LLAMA_ARG_N_PARALLEL=2
Environment=LLAMA_ARG_FLASH_ATTN=on
Environment=LLAMA_ARG_CACHE_TYPE_K=q8_0
Environment=LLAMA_ARG_CACHE_TYPE_V=q8_0
Environment=LLAMA_ARG_CACHE_REUSE=256
Environment=LLAMA_ARG_CACHE_RAM=16384
Environment=LLAMA_ARG_BATCH=2048
Environment=LLAMA_ARG_UBATCH=2048
Environment=LLAMA_ARG_ENDPOINT_METRICS=1
Environment=LLAMA_ARG_ENDPOINT_SLOTS=1
Environment=LLAMA_ARG_OFFLINE=1
Environment=LLAMA_ARG_MODELS_MAX=1
