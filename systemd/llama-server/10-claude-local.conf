# claude-local: fit llama-server to a single small-model coding client.
# Mirrors ollama.service.d/10-claude-local.conf: 128K context, q8_0 KV (needs
# flash attention), one slot, KV-shift cache reuse, prompt cache kept in RAM,
# Ollama-parity batch sizes, up to two resident models in router mode (two 27B-class
# models take 56GB of the 108GB pool and leave ~50GB for KV, the RAM prompt cache and the
# desktop; a third load evicts the least recently used after the proxy has checkpointed
# it). --slot-save-path and --no-webui have no LLAMA_ARG_* form and are passed by the wrapper.
[Service]
Environment=LLAMA_ARG_CTX_SIZE=131072
Environment=LLAMA_ARG_N_PARALLEL=1
Environment=LLAMA_ARG_FLASH_ATTN=on
Environment=LLAMA_ARG_CACHE_TYPE_K=q8_0
Environment=LLAMA_ARG_CACHE_TYPE_V=q8_0
Environment=LLAMA_ARG_CACHE_REUSE=256
Environment=LLAMA_ARG_CACHE_RAM=8192
Environment=LLAMA_ARG_BATCH=2048
Environment=LLAMA_ARG_UBATCH=2048
Environment=LLAMA_ARG_ENDPOINT_METRICS=1
Environment=LLAMA_ARG_ENDPOINT_SLOTS=1
Environment=LLAMA_ARG_OFFLINE=1
Environment=LLAMA_ARG_MODELS_MAX=2
