# claude-local: fit the server to a single small-model coding client.
# 128K context matched by the launcher's --autocompact (Claude's floor is 100K);
# q8_0 KV cache halves KV memory (needs flash attention, already on);
# one parallel slot so the whole context budget goes to the one client.
[Service]
Environment=OLLAMA_CONTEXT_LENGTH=131072
Environment=OLLAMA_KV_CACHE_TYPE=q8_0
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_KEEP_ALIVE=2h
